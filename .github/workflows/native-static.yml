name: Native PX4 software checks
on: [push, pull_request]
jobs:
  software:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install -r src/uav_system/test/requirements.txt
      - run: bash src/uav_system/scripts/run_checks.sh
